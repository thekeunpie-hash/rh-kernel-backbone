name: Update Upstream RH Cleanup Tracker

on:
  schedule:
    # Fast-path 10-min schedule (more reliable than */5 on GitHub scheduler; skips shallow clone when main HEAD is unchanged)
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_upstream_tracker.py"
      - "scripts/fetch_verifytask.py"
      - "scripts/fetch_rh_shrink.py"
      - "scripts/fetch_upstream_pr_insights.py"
      - ".github/workflows/update-tracker.yml"
  workflow_dispatch:
    inputs:
      chained:
        description: "Set by the rearm job; chained runs keep the hourly guards like scheduled runs"
        required: false
        default: "false"

permissions:
  contents: write
  # actions: write lets the rearm job dispatch the next run (GITHUB_TOKEN may trigger workflow_dispatch).
  actions: write

concurrency:
  group: update-tracker
  cancel-in-progress: false

env:
  # Periodic = cron or self-chained dispatch; manual dispatch and push still force the hourly steps.
  PERIODIC: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.chained == 'true') }}

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    outputs:
      started: ${{ steps.clock.outputs.started }}
    steps:
      - name: Record job start time
        id: clock
        run: echo "started=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout rh-kernel-backbone
        uses: actions/checkout@v4
        with:
          # Always measure on top of the current main head (push runs would otherwise start from the pushed sha).
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Measure live leanprover-community/riemann-hypothesis main and PR queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Hourly guard keyed to the last successful build (generated_at in the committed JSON), not to the clock
          # minute: chained runs drift, so a "minute < 5" window was missed about half the hours, and a failed build
          # waited a full hour. A missing, unreadable or future timestamp counts as stale.
          if [ "$PERIODIC" = "true" ] && python3 -c 'import json, sys, datetime as d
          try:
              t = d.datetime.strptime(json.load(open("data/community_context.json", encoding="utf-8"))["generated_at"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=d.timezone.utc)
          except Exception:
              sys.exit(1)
          age = (d.datetime.now(d.timezone.utc) - t).total_seconds()
          sys.exit(0 if 0 <= age < 55 * 60 else 1)'; then
            echo "Community context built under 55 min ago; skipping."
          else
            python3 scripts/build_community_context.py || true
          fi
          python3 scripts/update_upstream_tracker.py --data data/upstream_frontier.json

      - name: Fetch Bohrium Playground RH core results (riemann.verifytask.cn)
        continue-on-error: true
        run: |
          python3 scripts/fetch_verifytask.py --data data/verifytask_board.json

      - name: Fetch rh-shrink proof-size series (rh-shrink.github.io)
        continue-on-error: true
        run: |
          python3 scripts/fetch_rh_shrink.py --data data/rh_shrink.json

      - name: Fetch upstream PR metadata insights (hourly / manual / push)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$PERIODIC" = "true" ]; then
            python3 scripts/fetch_upstream_pr_insights.py --data data/upstream_pr_insights.json --min-interval-minutes 50
          else
            python3 scripts/fetch_upstream_pr_insights.py --data data/upstream_pr_insights.json
          fi

      - name: Commit updated metrics if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CHANGED="$(git status --porcelain -- data/upstream_frontier.json data/community_context.json data/COMMUNITY_BRIEF.md data/verifytask_board.json data/rh_shrink.json data/upstream_pr_insights.json | cut -c4-)"
          if [ -z "$CHANGED" ]; then
            echo "No upstream metric changes."
            exit 0
          fi
          CHANGED_LIST="$CHANGED" TRIGGER="${{ github.event_name }}" RUN_ID="${{ github.run_id }}" python3 -c 'import json,os,datetime;json.dump({"refreshed_at":datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),"trigger":os.environ["TRIGGER"],"run_id":os.environ["RUN_ID"],"changed":os.environ["CHANGED_LIST"].split()},open("data/refresh_status.json","w",encoding="utf-8"),indent=2)'
          # The data files are fully regenerated, so on a race this run's copies are laid over the newest main
          # with plumbing (a rebase conflicts whenever another run rewrote the same JSON).
          FILES="$CHANGED data/refresh_status.json"
          MSG="chore(tracker): auto-update upstream main metrics ($(date -u +%Y-%m-%dT%H:%MZ))"
          for attempt in 1 2 3 4; do
            # A transient fetch error (the step runs under bash -e) used to end the step and drop this run's data.
            if ! git fetch -q origin main; then
              echo "Fetch attempt $attempt failed; retrying."
              sleep $((attempt * 5))
              continue
            fi
            BASE="$(git rev-parse origin/main)"
            export GIT_INDEX_FILE="$RUNNER_TEMP/tracker-index"
            git read-tree "$BASE"
            for f in $FILES; do
              git update-index --add --cacheinfo "100644,$(git hash-object -w "$f"),$f"
            done
            TREE="$(git write-tree)"
            unset GIT_INDEX_FILE
            if [ "$TREE" = "$(git rev-parse "$BASE^{tree}")" ]; then
              echo "Newest main already has this data."
              exit 0
            fi
            COMMIT="$(git commit-tree "$TREE" -p "$BASE" -m "$MSG")"
            if git push origin "$COMMIT:refs/heads/main"; then
              exit 0
            fi
            echo "Push attempt $attempt lost a race; retrying on the newest main."
            sleep $((attempt * 5))
          done
          exit 1

  # GitHub's scheduler fires "*/10" cron only a few times a day on this repo (7 scheduled runs in ~2 days),
  # so each run dispatches its successor. The concurrency group keeps at most one running + one pending run,
  # so overlapping cron/push/dispatch chains collapse into one. Stop the chain by setting the repository
  # variable TRACKER_SELF_CHAIN=off (Settings > Secrets and variables > Actions > Variables) or disabling the workflow.
  rearm:
    needs: update-tracker
    if: ${{ !cancelled() && vars.TRACKER_SELF_CHAIN != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the next 10-minute slot, then dispatch the next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTERVAL_SECONDS: ${{ vars.TRACKER_INTERVAL_SECONDS || '600' }}
          STARTED: ${{ needs.update-tracker.outputs.started }}
        run: |
          case "$INTERVAL_SECONDS" in ''|*[!0-9]*) INTERVAL_SECONDS=600 ;; esac
          case "$STARTED" in ''|*[!0-9]*) STARTED=$(date -u +%s) ;; esac
          # Base 10: a variable like "0600" would otherwise be read as octal (384 s), and "0900" is a syntax error.
          INTERVAL_SECONDS=$((10#$INTERVAL_SECONDS))
          STARTED=$((10#$STARTED))
          ELAPSED=$(( $(date -u +%s) - STARTED ))
          WAIT=$(( INTERVAL_SECONDS - ELAPSED ))
          if [ "$WAIT" -gt 720 ]; then WAIT=720; fi
          if [ "$WAIT" -lt 60 ]; then WAIT=60; fi
          if [ "$WAIT" -gt 0 ]; then echo "Sleeping ${WAIT}s"; sleep "$WAIT"; fi
          for attempt in 1 2 3; do
            CODE=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-tracker.yml/dispatches" -d '{"ref":"main","inputs":{"chained":"true"}}')
            if [ "$CODE" = "204" ]; then echo "Next run dispatched."; exit 0; fi
            echo "Dispatch attempt $attempt returned $CODE"; cat /tmp/dispatch.out || true
            sleep 15
          done
          exit 1
