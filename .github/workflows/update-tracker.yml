name: Update Upstream RH Cleanup Tracker

on:
  schedule:
    # 7-day intensive fast-path polling (every 5 min; full 150k-file scan only runs when upstream main HEAD changes)
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tracker
  cancel-in-progress: false

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rh-kernel-backbone
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Measure live leanprover-community/riemann-hypothesis main and PR queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MIN=$((10#$(date -u +%M)))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$MIN" -lt 5 ]; then
            python3 scripts/build_community_context.py || true
          fi
          python3 scripts/update_upstream_tracker.py --data data/upstream_frontier.json

      - name: Commit updated metrics if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/upstream_frontier.json data/community_context.json data/COMMUNITY_BRIEF.md; then
            git add data/upstream_frontier.json data/community_context.json data/COMMUNITY_BRIEF.md
            git commit -m "chore(tracker): auto-update upstream main metrics ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No upstream metric changes."
          fi
