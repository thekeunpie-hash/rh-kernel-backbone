name: Update Upstream RH Cleanup Tracker

on:
  schedule:
    # Fast-path 10-min schedule (more reliable than */5 on GitHub scheduler; skips shallow clone when main HEAD is unchanged)
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_upstream_tracker.py"
      - "scripts/fetch_verifytask.py"
      - ".github/workflows/update-tracker.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tracker
  cancel-in-progress: false

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rh-kernel-backbone
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Measure live leanprover-community/riemann-hypothesis main and PR queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MIN=$((10#$(date -u +%M)))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$MIN" -lt 5 ]; then
            python3 scripts/build_community_context.py || true
          fi
          python3 scripts/update_upstream_tracker.py --data data/upstream_frontier.json

      - name: Fetch Bohrium Playground RH core results (riemann.verifytask.cn)
        continue-on-error: true
        run: |
          python3 scripts/fetch_verifytask.py --data data/verifytask_board.json

      - name: Commit updated metrics if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CHANGED="$(git status --porcelain -- data/upstream_frontier.json data/community_context.json data/COMMUNITY_BRIEF.md data/verifytask_board.json | cut -c4-)"
          if [ -n "$CHANGED" ]; then
            git add -- $CHANGED
            git commit -m "chore(tracker): auto-update upstream main metrics ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No upstream metric changes."
          fi
